<svg xmlns="http://www.w3.org/2000/svg" width="548" height="223" viewBox="0 0 548 223" role="img" aria-label="UsingElements TypeScript example">
  <rect width="100%" height="100%" fill="#1E1E1E"/>
  <g font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="16" fill="#D4D4D4">
  <text x="24" y="40" xml:space="preserve"><tspan fill="#C586C0">export</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#4FC1FF">UsingElements</tspan><tspan fill="#D4D4D4"> = </tspan><tspan fill="#DCDCAA">component</tspan><tspan fill="#D4D4D4">(() </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#4EC9B0" font-weight="bold">div</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">`</tspan></text>
  <text x="24" y="65" xml:space="preserve"><tspan fill="#CE9178">  My parent is easy to spot!</tspan></text>
