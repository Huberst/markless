  <text x="24" y="115" xml:space="preserve"></text>
  <text x="24" y="140" xml:space="preserve"><tspan fill="#6A9955">// This is how to attach the component to the DOM.</tspan></text>
  <text x="24" y="165" xml:space="preserve"><tspan fill="#6A9955">// We won&apos;t repeat this for every example.</tspan></text>
  <text x="24" y="190" xml:space="preserve"><tspan fill="#DCDCAA">renderToDom</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">document</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">body</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#9CDCFE">UsingElements</tspan><tspan fill="#D4D4D4">)</tspan></text>
  </g>
