<svg xmlns="http://www.w3.org/2000/svg" width="922" height="1873" viewBox="0 0 922 1873" role="img" aria-label="MinimalTodo TypeScript example">
  <rect width="100%" height="100%" fill="#1E1E1E"/>
  <g font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="16" fill="#D4D4D4">
  <text x="24" y="40" xml:space="preserve"><tspan fill="#C586C0">export</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#DCDCAA">MinimalTodo</tspan><tspan fill="#D4D4D4"> = () </tspan><tspan fill="#569CD6">=&gt;</tspan></text>
  <text x="24" y="65" xml:space="preserve"><tspan fill="#D4D4D4">  </tspan><tspan fill="#DCDCAA">component</tspan><tspan fill="#D4D4D4">((): </tspan><tspan fill="#4EC9B0">MarkLess</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> {</tspan></text>
  <text x="24" y="90" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// ℹ️ Reactivity is provided via Reactive Adapters. You can use preact/signals, rxjs</tspan></text>
  <text x="24" y="115" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// or any other library - as long as you wrap it in a compatible adapter.</tspan></text>
  <text x="24" y="140" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// Here we use Preact Signals via the RA helper.</tspan></text>
  <text x="24" y="165" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#4FC1FF">todosSig</tspan><tspan fill="#D4D4D4"> = </tspan><tspan fill="#DCDCAA">signal</tspan><tspan fill="#D4D4D4">([</tspan><tspan fill="#9CDCFE">firstTodo</tspan><tspan fill="#D4D4D4">, ...</tspan><tspan fill="#9CDCFE">initialEntries</tspan><tspan fill="#D4D4D4">])</tspan></text>
  <text x="24" y="190" xml:space="preserve"></text>
  <text x="24" y="215" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// ℹ️ Here we create two derived reactive adapters for done and open todos.</tspan></text>
  <text x="24" y="240" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> [</tspan><tspan fill="#4FC1FF">done</tspan><tspan fill="#D4D4D4">] = </tspan><tspan fill="#DCDCAA">toRa</tspan><tspan fill="#D4D4D4">(</tspan></text>
  <text x="24" y="265" xml:space="preserve"><tspan fill="#D4D4D4">      </tspan><tspan fill="#DCDCAA">computed</tspan><tspan fill="#D4D4D4">(() </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#9CDCFE">todosSig</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">value</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">filter</tspan><tspan fill="#D4D4D4">((</tspan><tspan fill="#9CDCFE">t</tspan><tspan fill="#D4D4D4">) </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#9CDCFE">t</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">completed</tspan><tspan fill="#D4D4D4">)),</tspan></text>
  <text x="24" y="290" xml:space="preserve"><tspan fill="#D4D4D4">    )</tspan></text>
  <text x="24" y="315" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> [</tspan><tspan fill="#4FC1FF">open</tspan><tspan fill="#D4D4D4">] = </tspan><tspan fill="#DCDCAA">toRa</tspan><tspan fill="#D4D4D4">(</tspan></text>
  <text x="24" y="340" xml:space="preserve"><tspan fill="#D4D4D4">      </tspan><tspan fill="#DCDCAA">computed</tspan><tspan fill="#D4D4D4">(() </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#9CDCFE">todosSig</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">value</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">filter</tspan><tspan fill="#D4D4D4">((</tspan><tspan fill="#9CDCFE">t</tspan><tspan fill="#D4D4D4">) </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> !</tspan><tspan fill="#9CDCFE">t</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">completed</tspan><tspan fill="#D4D4D4">)),</tspan></text>
  <text x="24" y="365" xml:space="preserve"><tspan fill="#D4D4D4">    )</tspan></text>
  <text x="24" y="390" xml:space="preserve"></text>
  <text x="24" y="415" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// ℹ️ Use ref to get a handle on the input element.</tspan></text>
  <text x="24" y="440" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// Check the use of the setRef method below.</tspan></text>
  <text x="24" y="465" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#569CD6">let</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#9CDCFE">inputRef</tspan><tspan fill="#D4D4D4">: </tspan><tspan fill="#4EC9B0">HTMLInputElement</tspan><tspan fill="#D4D4D4"> | </tspan><tspan fill="#4EC9B0">null</tspan><tspan fill="#D4D4D4"> = </tspan><tspan fill="#569CD6">null</tspan></text>
  <text x="24" y="490" xml:space="preserve"></text>
  <text x="24" y="515" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// ℹ️ Place functions to work with the reactive data here.</tspan></text>
  <text x="24" y="540" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// You can also organize them outside the component function, it depends on your needs.</tspan></text>
  <text x="24" y="565" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#DCDCAA">addTodo</tspan><tspan fill="#D4D4D4"> = () </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> {</tspan></text>
  <text x="24" y="590" xml:space="preserve"><tspan fill="#D4D4D4">      </tspan><tspan fill="#C586C0">if</tspan><tspan fill="#D4D4D4"> (</tspan><tspan fill="#9CDCFE">inputRef</tspan><tspan fill="#D4D4D4"> &amp;&amp; </tspan><tspan fill="#9CDCFE">inputRef</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">value</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">trim</tspan><tspan fill="#D4D4D4">() !== </tspan><tspan fill="#CE9178">&apos;&apos;</tspan><tspan fill="#D4D4D4">) {</tspan></text>
  <text x="24" y="615" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#4FC1FF">newTodo</tspan><tspan fill="#D4D4D4">: </tspan><tspan fill="#4EC9B0">TodoEntry</tspan><tspan fill="#D4D4D4"> = {</tspan></text>
  <text x="24" y="640" xml:space="preserve"><tspan fill="#D4D4D4">          </tspan><tspan fill="#9CDCFE">val:</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#9CDCFE">inputRef</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">value</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">trim</tspan><tspan fill="#D4D4D4">(),</tspan></text>
  <text x="24" y="665" xml:space="preserve"><tspan fill="#D4D4D4">          </tspan><tspan fill="#9CDCFE">completed:</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#569CD6">false</tspan><tspan fill="#D4D4D4">,</tspan></text>
  <text x="24" y="690" xml:space="preserve"><tspan fill="#D4D4D4">        }</tspan></text>
  <text x="24" y="715" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#9CDCFE">todosSig</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">value</tspan><tspan fill="#D4D4D4"> = [...</tspan><tspan fill="#9CDCFE">todosSig</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">value</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#9CDCFE">newTodo</tspan><tspan fill="#D4D4D4">]</tspan></text>
  <text x="24" y="740" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#9CDCFE">inputRef</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">value</tspan><tspan fill="#D4D4D4"> = </tspan><tspan fill="#CE9178">&apos;&apos;</tspan></text>
  <text x="24" y="765" xml:space="preserve"><tspan fill="#D4D4D4">      }</tspan></text>
  <text x="24" y="790" xml:space="preserve"><tspan fill="#D4D4D4">    }</tspan></text>
  <text x="24" y="815" xml:space="preserve"></text>
  <text x="24" y="840" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#DCDCAA">toggleTodo</tspan><tspan fill="#D4D4D4"> = (</tspan><tspan fill="#9CDCFE">todo</tspan><tspan fill="#D4D4D4">: </tspan><tspan fill="#4EC9B0">TodoEntry</tspan><tspan fill="#D4D4D4">) </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> {</tspan></text>
  <text x="24" y="865" xml:space="preserve"><tspan fill="#D4D4D4">      </tspan><tspan fill="#9CDCFE">todosSig</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">value</tspan><tspan fill="#D4D4D4"> = </tspan><tspan fill="#9CDCFE">todosSig</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">value</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">map</tspan><tspan fill="#D4D4D4">((</tspan><tspan fill="#9CDCFE">t</tspan><tspan fill="#D4D4D4">) </tspan><tspan fill="#569CD6">=&gt;</tspan></text>
  <text x="24" y="890" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#9CDCFE">t</tspan><tspan fill="#D4D4D4"> === </tspan><tspan fill="#9CDCFE">todo</tspan><tspan fill="#D4D4D4"> ? { ...</tspan><tspan fill="#9CDCFE">t</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#9CDCFE">completed:</tspan><tspan fill="#D4D4D4"> !</tspan><tspan fill="#9CDCFE">t</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">completed</tspan><tspan fill="#D4D4D4"> } : </tspan><tspan fill="#9CDCFE">t</tspan><tspan fill="#D4D4D4">,</tspan></text>
  <text x="24" y="915" xml:space="preserve"><tspan fill="#D4D4D4">      )</tspan></text>
  <text x="24" y="940" xml:space="preserve"><tspan fill="#D4D4D4">    }</tspan></text>
  <text x="24" y="965" xml:space="preserve"></text>
  <text x="24" y="990" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// ℹ️ Make small helpers like this one to avoid redundancy.</tspan></text>
  <text x="24" y="1015" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#DCDCAA">listItem</tspan><tspan fill="#D4D4D4"> = (</tspan><tspan fill="#9CDCFE">todo</tspan><tspan fill="#D4D4D4">: </tspan><tspan fill="#4EC9B0">TodoEntry</tspan><tspan fill="#D4D4D4">) </tspan><tspan fill="#569CD6">=&gt;</tspan></text>
  <text x="24" y="1040" xml:space="preserve"><tspan fill="#D4D4D4">      </tspan><tspan fill="#4EC9B0" font-weight="bold">li</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">([</tspan></text>
  <text x="24" y="1065" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#4EC9B0" font-weight="bold">div</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">([</tspan><tspan fill="#9CDCFE">todo</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">completed</tspan><tspan fill="#D4D4D4"> ? </tspan><tspan fill="#CE9178">&apos;✅ &apos;</tspan><tspan fill="#D4D4D4"> : </tspan><tspan fill="#CE9178">&apos;📝 &apos;</tspan><tspan fill="#D4D4D4">]),</tspan></text>
  <text x="24" y="1090" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#4EC9B0" font-weight="bold">div</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">todo</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">val</tspan><tspan fill="#D4D4D4">),</tspan></text>
  <text x="24" y="1115" xml:space="preserve"><tspan fill="#D4D4D4">      ])</tspan></text>
  <text x="24" y="1140" xml:space="preserve"><tspan fill="#D4D4D4">      .</tspan><tspan fill="#DCDCAA">event</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;click&apos;</tspan><tspan fill="#D4D4D4">, () </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#DCDCAA">toggleTodo</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">todo</tspan><tspan fill="#D4D4D4">))</tspan></text>
  <text x="24" y="1165" xml:space="preserve"></text>
  <text x="24" y="1190" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#C586C0">return</tspan><tspan fill="#D4D4D4"> [</tspan></text>
  <text x="24" y="1215" xml:space="preserve"><tspan fill="#D4D4D4">      </tspan><tspan fill="#4EC9B0" font-weight="bold">h1</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;Minimal Todo List&apos;</tspan><tspan fill="#D4D4D4">),</tspan></text>
  <text x="24" y="1240" xml:space="preserve"><tspan fill="#D4D4D4">      </tspan><tspan fill="#4EC9B0" font-weight="bold">p</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;A simple todo list example using markless.&apos;</tspan><tspan fill="#D4D4D4">),</tspan></text>
  <text x="24" y="1265" xml:space="preserve"></text>
  <text x="24" y="1290" xml:space="preserve"><tspan fill="#D4D4D4">      </tspan><tspan fill="#4EC9B0" font-weight="bold">input</tspan></text>
  <text x="24" y="1315" xml:space="preserve"><tspan fill="#D4D4D4">        .</tspan><tspan fill="#DCDCAA">attr</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;placeholder&apos;</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#CE9178">&apos;New Entry&apos;</tspan><tspan fill="#D4D4D4">)</tspan></text>
  <text x="24" y="1340" xml:space="preserve"><tspan fill="#D4D4D4">        .</tspan><tspan fill="#DCDCAA">setRef</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">ref</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> { </tspan><tspan fill="#9CDCFE">inputRef</tspan><tspan fill="#D4D4D4"> = </tspan><tspan fill="#9CDCFE">ref</tspan><tspan fill="#D4D4D4"> }),</tspan></text>
  <text x="24" y="1365" xml:space="preserve"></text>
  <text x="24" y="1390" xml:space="preserve"><tspan fill="#D4D4D4">      </tspan><tspan fill="#4EC9B0" font-weight="bold">button</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;Add Todo&apos;</tspan><tspan fill="#D4D4D4">).</tspan><tspan fill="#DCDCAA">event</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;click&apos;</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#9CDCFE">addTodo</tspan><tspan fill="#D4D4D4">),</tspan></text>
  <text x="24" y="1415" xml:space="preserve"></text>
  <text x="24" y="1440" xml:space="preserve"><tspan fill="#D4D4D4">      </tspan><tspan fill="#4EC9B0" font-weight="bold">div</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">class</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;list-wrapper&apos;</tspan><tspan fill="#D4D4D4">).</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">([</tspan></text>
  <text x="24" y="1465" xml:space="preserve"></text>
  <text x="24" y="1490" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#4EC9B0" font-weight="bold">h2</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;Completed Todos&apos;</tspan><tspan fill="#D4D4D4">),</tspan></text>
  <text x="24" y="1515" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#4EC9B0" font-weight="bold">ul</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">class</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;todo-list completed&apos;</tspan><tspan fill="#D4D4D4">).</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan></text>
  <text x="24" y="1540" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#DCDCAA">_EACH</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">done</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#4EC9B0" font-weight="bold">i</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#4EC9B0" font-weight="bold">i</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">val</tspan><tspan fill="#D4D4D4">)</tspan></text>
  <text x="24" y="1565" xml:space="preserve"><tspan fill="#D4D4D4">          .</tspan><tspan fill="#DCDCAA">DO</tspan><tspan fill="#D4D4D4">((</tspan><tspan fill="#9CDCFE">item</tspan><tspan fill="#D4D4D4">) </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#DCDCAA">listItem</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">item</tspan><tspan fill="#D4D4D4">))</tspan></text>
  <text x="24" y="1590" xml:space="preserve"><tspan fill="#D4D4D4">        ),</tspan></text>
  <text x="24" y="1615" xml:space="preserve"></text>
  <text x="24" y="1640" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#4EC9B0" font-weight="bold">h2</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;Open Todos&apos;</tspan><tspan fill="#D4D4D4">),</tspan></text>
  <text x="24" y="1665" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#4EC9B0" font-weight="bold">ul</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">class</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;todo-list&apos;</tspan><tspan fill="#D4D4D4">).</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan></text>
  <text x="24" y="1690" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#DCDCAA">_EACH</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">open</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#4EC9B0" font-weight="bold">i</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#4EC9B0" font-weight="bold">i</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">val</tspan><tspan fill="#D4D4D4">)</tspan></text>
  <text x="24" y="1715" xml:space="preserve"><tspan fill="#D4D4D4">          .</tspan><tspan fill="#DCDCAA">DO</tspan><tspan fill="#D4D4D4">((</tspan><tspan fill="#9CDCFE">item</tspan><tspan fill="#D4D4D4">) </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#DCDCAA">listItem</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">item</tspan><tspan fill="#D4D4D4">))</tspan></text>
  <text x="24" y="1740" xml:space="preserve"><tspan fill="#D4D4D4">        ),</tspan></text>
  <text x="24" y="1765" xml:space="preserve"></text>
  <text x="24" y="1790" xml:space="preserve"><tspan fill="#D4D4D4">      ])</tspan></text>
  <text x="24" y="1815" xml:space="preserve"><tspan fill="#D4D4D4">    ]</tspan></text>
  <text x="24" y="1840" xml:space="preserve"><tspan fill="#D4D4D4">  })</tspan></text>
  </g>
</svg>
