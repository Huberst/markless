<svg xmlns="http://www.w3.org/2000/svg" width="807" height="623" viewBox="0 0 807 623" role="img" aria-label="UsingElementsNesting TypeScript example">
  <rect width="100%" height="100%" fill="#1E1E1E"/>
  <g font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="16" fill="#D4D4D4">
  <text x="24" y="40" xml:space="preserve"><tspan fill="#6A9955">// Components simply return MarkLess, which can be text, html element classes,</tspan></text>
  <text x="24" y="65" xml:space="preserve"><tspan fill="#6A9955">// other components, control structures or reactive adapters</tspan></text>
  <text x="24" y="90" xml:space="preserve"><tspan fill="#6A9955">// (more about that later).</tspan></text>
  <text x="24" y="115" xml:space="preserve"><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#DCDCAA">NestedHighlight</tspan><tspan fill="#D4D4D4"> = (</tspan><tspan fill="#9CDCFE">text</tspan><tspan fill="#D4D4D4">: </tspan><tspan fill="#4EC9B0">string</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#9CDCFE">color</tspan><tspan fill="#D4D4D4">: </tspan><tspan fill="#4EC9B0">string</tspan><tspan fill="#D4D4D4">) </tspan><tspan fill="#569CD6">=&gt;</tspan></text>
  <text x="24" y="140" xml:space="preserve"><tspan fill="#D4D4D4">  </tspan><tspan fill="#DCDCAA">component</tspan><tspan fill="#D4D4D4">(</tspan></text>
  <text x="24" y="165" xml:space="preserve"><tspan fill="#D4D4D4">    (): </tspan><tspan fill="#4EC9B0">MarkLess</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#569CD6">=&gt;</tspan></text>
  <text x="24" y="190" xml:space="preserve"><tspan fill="#D4D4D4">      </tspan><tspan fill="#9CDCFE">p</tspan></text>
  <text x="24" y="215" xml:space="preserve"><tspan fill="#D4D4D4">        .</tspan><tspan fill="#4EC9B0" font-weight="bold">style</tspan><tspan fill="#D4D4D4">({ </tspan><tspan fill="#9CDCFE">color</tspan><tspan fill="#D4D4D4"> })</tspan></text>
  <text x="24" y="240" xml:space="preserve"><tspan fill="#D4D4D4">        .</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">text</tspan><tspan fill="#D4D4D4">),</tspan></text>
  <text x="24" y="265" xml:space="preserve"><tspan fill="#D4D4D4">  )</tspan></text>
  <text x="24" y="290" xml:space="preserve"></text>
  <text x="24" y="315" xml:space="preserve"><tspan fill="#6A9955">// This component simply nests elements and a component.</tspan></text>
  <text x="24" y="340" xml:space="preserve"><tspan fill="#C586C0">export</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#4FC1FF">UsingElementsNesting</tspan><tspan fill="#D4D4D4"> = </tspan><tspan fill="#DCDCAA">component</tspan><tspan fill="#D4D4D4">(() </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#9CDCFE">div</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan></text>
  <text x="24" y="365" xml:space="preserve"><tspan fill="#D4D4D4">  </tspan><tspan fill="#9CDCFE">h2</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;Structured HTML Tags -&gt; TypeScript Classes&apos;</tspan><tspan fill="#D4D4D4">),</tspan></text>
  <text x="24" y="390" xml:space="preserve"><tspan fill="#D4D4D4">  </tspan><tspan fill="#9CDCFE">p</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;Instead of opening and closing tags, you call the ._ method to add...&apos;</tspan><tspan fill="#D4D4D4">),</tspan></text>
  <text x="24" y="415" xml:space="preserve"><tspan fill="#D4D4D4">  </tspan><tspan fill="#9CDCFE">div</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan></text>
  <text x="24" y="440" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#9CDCFE">h3</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;Children...&apos;</tspan><tspan fill="#D4D4D4">),</tspan></text>
  <text x="24" y="465" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#9CDCFE">p</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan></text>
  <text x="24" y="490" xml:space="preserve"><tspan fill="#D4D4D4">      </tspan><tspan fill="#CE9178">&apos;to an element.&apos;</tspan><tspan fill="#D4D4D4">,</tspan></text>
  <text x="24" y="515" xml:space="preserve"><tspan fill="#D4D4D4">      </tspan><tspan fill="#DCDCAA">NestedHighlight</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;Of course you can nest components too!&apos;</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#CE9178">&apos;gold&apos;</tspan><tspan fill="#D4D4D4">),</tspan></text>
  <text x="24" y="540" xml:space="preserve"><tspan fill="#D4D4D4">    ),</tspan></text>
  <text x="24" y="565" xml:space="preserve"><tspan fill="#D4D4D4">  ),</tspan></text>
  <text x="24" y="590" xml:space="preserve"><tspan fill="#D4D4D4">))</tspan></text>
  </g>
</svg>
