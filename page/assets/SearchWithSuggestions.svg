<svg xmlns="http://www.w3.org/2000/svg" width="845" height="1898" viewBox="0 0 845 1898" role="img" aria-label="SearchWithSuggestions TypeScript example">
  <rect width="100%" height="100%" fill="#1E1E1E"/>
  <g font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="16" fill="#D4D4D4">
  <text x="24" y="40" xml:space="preserve"><tspan fill="#C586C0">export</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#DCDCAA">SearchWithSuggestions</tspan><tspan fill="#D4D4D4"> = () </tspan><tspan fill="#569CD6">=&gt;</tspan></text>
  <text x="24" y="65" xml:space="preserve"><tspan fill="#D4D4D4">  </tspan><tspan fill="#DCDCAA">component</tspan><tspan fill="#D4D4D4">(() </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> {</tspan></text>
  <text x="24" y="90" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// Pass reactive adapters to _IF, _EACH, and _DYNAMIC to have the UI update</tspan></text>
  <text x="24" y="115" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// the presence of DOM elements.</tspan></text>
  <text x="24" y="140" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// So bring your reactive sources of choice and use them in reactive adapters</tspan></text>
  <text x="24" y="165" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// to drive the UI. For this example, we use RxJS and Preact Signals.</tspan></text>
  <text x="24" y="190" xml:space="preserve"></text>
  <text x="24" y="215" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// Signal example: Track whether the async fetchSuggestions is in-flight, or</tspan></text>
  <text x="24" y="240" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// if the user is typing. Signal stuff for the UI to reactively feedback.</tspan></text>
  <text x="24" y="265" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#4FC1FF">isLoadingSig</tspan><tspan fill="#D4D4D4"> = </tspan><tspan fill="#DCDCAA">signal</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#569CD6">false</tspan><tspan fill="#D4D4D4">)</tspan></text>
  <text x="24" y="290" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#4FC1FF">isTypingSig</tspan><tspan fill="#D4D4D4"> = </tspan><tspan fill="#DCDCAA">signal</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#569CD6">false</tspan><tspan fill="#D4D4D4">)</tspan></text>
  <text x="24" y="315" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// Of course you can use whatever your reactive lib offers, like computed,</tspan></text>
  <text x="24" y="340" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// as long as the returned shape fits the reactive adapter.</tspan></text>
  <text x="24" y="365" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// Creating a reactive adapter for any reactive lib is easy an straightforward.</tspan></text>
  <text x="24" y="390" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// Check out reactive-adapters.ts in src/ (rxjs and signal example).</tspan></text>
  <text x="24" y="415" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> [</tspan><tspan fill="#4FC1FF">states</tspan><tspan fill="#D4D4D4">] = </tspan><tspan fill="#DCDCAA">toRa</tspan><tspan fill="#D4D4D4">(</tspan></text>
  <text x="24" y="440" xml:space="preserve"><tspan fill="#D4D4D4">      </tspan><tspan fill="#DCDCAA">computed</tspan><tspan fill="#D4D4D4">(() </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> {</tspan></text>
  <text x="24" y="465" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#4FC1FF">states</tspan><tspan fill="#D4D4D4">: </tspan><tspan fill="#4EC9B0">string</tspan><tspan fill="#D4D4D4">[] = []</tspan></text>
  <text x="24" y="490" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#C586C0">if</tspan><tspan fill="#D4D4D4"> (</tspan><tspan fill="#9CDCFE">isLoadingSig</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">value</tspan><tspan fill="#D4D4D4">) </tspan><tspan fill="#9CDCFE">states</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">push</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;Loading...&apos;</tspan><tspan fill="#D4D4D4">)</tspan></text>
  <text x="24" y="515" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#C586C0">if</tspan><tspan fill="#D4D4D4"> (</tspan><tspan fill="#9CDCFE">isTypingSig</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">value</tspan><tspan fill="#D4D4D4">) </tspan><tspan fill="#9CDCFE">states</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">push</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;Typing...&apos;</tspan><tspan fill="#D4D4D4">)</tspan></text>
  <text x="24" y="540" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#C586C0">return</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#9CDCFE">states</tspan></text>
  <text x="24" y="565" xml:space="preserve"><tspan fill="#D4D4D4">      }),</tspan></text>
  <text x="24" y="590" xml:space="preserve"><tspan fill="#D4D4D4">    )</tspan></text>
  <text x="24" y="615" xml:space="preserve"></text>
  <text x="24" y="640" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// Use RxJS to debounce, distinct, and switchMap to the async fetchSuggestions.</tspan></text>
  <text x="24" y="665" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#4FC1FF">input$</tspan><tspan fill="#D4D4D4"> = </tspan><tspan fill="#569CD6">new</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#DCDCAA">Subject</tspan><tspan fill="#D4D4D4">&lt;</tspan><tspan fill="#4EC9B0">string</tspan><tspan fill="#D4D4D4">&gt;()</tspan></text>
  <text x="24" y="690" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> [</tspan><tspan fill="#4FC1FF">suggestions</tspan><tspan fill="#D4D4D4">] = </tspan><tspan fill="#DCDCAA">toRa</tspan><tspan fill="#D4D4D4">(</tspan></text>
  <text x="24" y="715" xml:space="preserve"><tspan fill="#D4D4D4">      </tspan><tspan fill="#9CDCFE">input$</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">pipe</tspan><tspan fill="#D4D4D4">(</tspan></text>
  <text x="24" y="740" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#DCDCAA">tap</tspan><tspan fill="#D4D4D4">(() </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#9CDCFE">isTypingSig</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">value</tspan><tspan fill="#D4D4D4"> = </tspan><tspan fill="#569CD6">true</tspan><tspan fill="#D4D4D4">),</tspan></text>
  <text x="24" y="765" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#DCDCAA">debounceTime</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#B5CEA8">500</tspan><tspan fill="#D4D4D4">),</tspan></text>
  <text x="24" y="790" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#DCDCAA">tap</tspan><tspan fill="#D4D4D4">(() </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#9CDCFE">isTypingSig</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">value</tspan><tspan fill="#D4D4D4"> = </tspan><tspan fill="#569CD6">false</tspan><tspan fill="#D4D4D4">),</tspan></text>
  <text x="24" y="815" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#DCDCAA">distinctUntilChanged</tspan><tspan fill="#D4D4D4">(),</tspan></text>
  <text x="24" y="840" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#DCDCAA">tap</tspan><tspan fill="#D4D4D4">(() </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#9CDCFE">isLoadingSig</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">value</tspan><tspan fill="#D4D4D4"> = </tspan><tspan fill="#569CD6">true</tspan><tspan fill="#D4D4D4">),</tspan></text>
  <text x="24" y="865" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#DCDCAA">switchMap</tspan><tspan fill="#D4D4D4">((</tspan><tspan fill="#9CDCFE">q</tspan><tspan fill="#D4D4D4">) </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> (</tspan></text>
  <text x="24" y="890" xml:space="preserve"><tspan fill="#D4D4D4">            </tspan><tspan fill="#9CDCFE">q</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">length</tspan><tspan fill="#D4D4D4"> &lt;= </tspan><tspan fill="#B5CEA8">0</tspan></text>
  <text x="24" y="915" xml:space="preserve"><tspan fill="#D4D4D4">              ? </tspan><tspan fill="#DCDCAA">of</tspan><tspan fill="#D4D4D4">([] </tspan><tspan fill="#C586C0">as</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#4EC9B0">string</tspan><tspan fill="#D4D4D4">[])</tspan></text>
  <text x="24" y="940" xml:space="preserve"><tspan fill="#D4D4D4">              : </tspan><tspan fill="#DCDCAA">from</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#DCDCAA">fetchSuggestions</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">q</tspan><tspan fill="#D4D4D4">))</tspan></text>
  <text x="24" y="965" xml:space="preserve"><tspan fill="#D4D4D4">          ).</tspan><tspan fill="#DCDCAA">pipe</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#DCDCAA">tap</tspan><tspan fill="#D4D4D4">(() </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#9CDCFE">isLoadingSig</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">value</tspan><tspan fill="#D4D4D4"> = </tspan><tspan fill="#569CD6">false</tspan><tspan fill="#D4D4D4">))</tspan></text>
  <text x="24" y="990" xml:space="preserve"><tspan fill="#D4D4D4">        ),</tspan></text>
  <text x="24" y="1015" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#DCDCAA">startWith</tspan><tspan fill="#D4D4D4">([] </tspan><tspan fill="#C586C0">as</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#4EC9B0">string</tspan><tspan fill="#D4D4D4">[]),</tspan></text>
  <text x="24" y="1040" xml:space="preserve"><tspan fill="#D4D4D4">      ),</tspan></text>
  <text x="24" y="1065" xml:space="preserve"><tspan fill="#D4D4D4">    )</tspan></text>
  <text x="24" y="1090" xml:space="preserve"></text>
  <text x="24" y="1115" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> [</tspan><tspan fill="#4FC1FF">inputCharCountOdd</tspan><tspan fill="#D4D4D4">] = </tspan><tspan fill="#DCDCAA">toRa</tspan><tspan fill="#D4D4D4">(</tspan></text>
  <text x="24" y="1140" xml:space="preserve"><tspan fill="#D4D4D4">      </tspan><tspan fill="#9CDCFE">input$</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">pipe</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#4EC9B0" font-weight="bold">map</tspan><tspan fill="#D4D4D4">((</tspan><tspan fill="#9CDCFE">query</tspan><tspan fill="#D4D4D4">) </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> (</tspan><tspan fill="#9CDCFE">query</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">length</tspan><tspan fill="#D4D4D4"> % </tspan><tspan fill="#B5CEA8">2</tspan><tspan fill="#D4D4D4"> === </tspan><tspan fill="#B5CEA8">1</tspan><tspan fill="#D4D4D4"> ? </tspan><tspan fill="#CE9178">&apos;odd&apos;</tspan><tspan fill="#D4D4D4"> : </tspan><tspan fill="#CE9178">&apos;&apos;</tspan><tspan fill="#D4D4D4">))),</tspan></text>
  <text x="24" y="1165" xml:space="preserve"><tspan fill="#D4D4D4">    )</tspan></text>
  <text x="24" y="1190" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#C586C0">return</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#9CDCFE">section</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">class</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;search-with-suggestions-example&apos;</tspan><tspan fill="#D4D4D4">).</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">([</tspan></text>
  <text x="24" y="1215" xml:space="preserve"></text>
  <text x="24" y="1240" xml:space="preserve"><tspan fill="#D4D4D4">      </tspan><tspan fill="#9CDCFE">h1</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;Example — Search with Suggestions&apos;</tspan><tspan fill="#D4D4D4">),</tspan></text>
  <text x="24" y="1265" xml:space="preserve"></text>
  <text x="24" y="1290" xml:space="preserve"><tspan fill="#D4D4D4">      </tspan><tspan fill="#9CDCFE">input</tspan></text>
  <text x="24" y="1315" xml:space="preserve"><tspan fill="#D4D4D4">        .</tspan><tspan fill="#DCDCAA">attrSet</tspan><tspan fill="#D4D4D4">({</tspan></text>
  <text x="24" y="1340" xml:space="preserve"><tspan fill="#D4D4D4">          </tspan><tspan fill="#9CDCFE">type:</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#CE9178">&apos;text&apos;</tspan><tspan fill="#D4D4D4">,</tspan></text>
  <text x="24" y="1365" xml:space="preserve"><tspan fill="#D4D4D4">          </tspan><tspan fill="#9CDCFE">placeholder:</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#CE9178">&apos;Type anything…&apos;</tspan><tspan fill="#D4D4D4">,</tspan></text>
  <text x="24" y="1390" xml:space="preserve"><tspan fill="#D4D4D4">        })</tspan></text>
  <text x="24" y="1415" xml:space="preserve"><tspan fill="#D4D4D4">        .</tspan><tspan fill="#DCDCAA">class</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;search-input&apos;</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#9CDCFE">inputCharCountOdd</tspan><tspan fill="#D4D4D4">)</tspan></text>
  <text x="24" y="1440" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#6A9955">// Event types are inferred. This is an input element, the event is</tspan></text>
  <text x="24" y="1465" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#6A9955">// an InputEvent, and the target is an HTMLInputElement. Just TypeScript.</tspan></text>
  <text x="24" y="1490" xml:space="preserve"><tspan fill="#D4D4D4">        .</tspan><tspan fill="#DCDCAA">event</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;input&apos;</tspan><tspan fill="#D4D4D4">, (</tspan><tspan fill="#9CDCFE">event</tspan><tspan fill="#D4D4D4">) </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> {</tspan></text>
  <text x="24" y="1515" xml:space="preserve"><tspan fill="#D4D4D4">          </tspan><tspan fill="#9CDCFE">input$</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">next</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">event</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">target</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">value</tspan><tspan fill="#D4D4D4">)</tspan></text>
  <text x="24" y="1540" xml:space="preserve"><tspan fill="#D4D4D4">        }),</tspan></text>
  <text x="24" y="1565" xml:space="preserve"></text>
  <text x="24" y="1590" xml:space="preserve"></text>
  <text x="24" y="1615" xml:space="preserve"><tspan fill="#D4D4D4">      </tspan><tspan fill="#DCDCAA">_EACH</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">states</tspan><tspan fill="#D4D4D4">)</tspan></text>
  <text x="24" y="1640" xml:space="preserve"><tspan fill="#D4D4D4">        .</tspan><tspan fill="#DCDCAA">DO</tspan><tspan fill="#D4D4D4">((</tspan><tspan fill="#9CDCFE">state</tspan><tspan fill="#D4D4D4">) </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#9CDCFE">p</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">state</tspan><tspan fill="#D4D4D4">)),</tspan></text>
  <text x="24" y="1665" xml:space="preserve"></text>
  <text x="24" y="1690" xml:space="preserve"><tspan fill="#D4D4D4">      </tspan><tspan fill="#9CDCFE">ul</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan></text>
  <text x="24" y="1715" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#DCDCAA">_EACH</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">suggestions</tspan><tspan fill="#D4D4D4">, (</tspan><tspan fill="#9CDCFE">word</tspan><tspan fill="#D4D4D4">) </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#9CDCFE">word</tspan><tspan fill="#D4D4D4">)</tspan></text>
  <text x="24" y="1740" xml:space="preserve"><tspan fill="#D4D4D4">          .</tspan><tspan fill="#DCDCAA">DO</tspan><tspan fill="#D4D4D4">((</tspan><tspan fill="#9CDCFE">word</tspan><tspan fill="#D4D4D4">) </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#9CDCFE">li</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">word</tspan><tspan fill="#D4D4D4">)),</tspan></text>
  <text x="24" y="1765" xml:space="preserve"><tspan fill="#D4D4D4">      ),</tspan></text>
  <text x="24" y="1790" xml:space="preserve"><tspan fill="#D4D4D4">    ])</tspan></text>
  <text x="24" y="1815" xml:space="preserve"><tspan fill="#D4D4D4">  })</tspan></text>
  <text x="24" y="1840" xml:space="preserve"></text>
  <text x="24" y="1865" xml:space="preserve"><tspan fill="#DCDCAA">renderToDom</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">document</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#4EC9B0" font-weight="bold">body</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#DCDCAA">SearchWithSuggestions</tspan><tspan fill="#D4D4D4">())</tspan></text>
  </g>
</svg>
