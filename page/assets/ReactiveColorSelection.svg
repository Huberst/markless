<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1098" viewBox="0 0 816 1098" role="img" aria-label="ReactiveColorSelection TypeScript example">
  <rect width="100%" height="100%" fill="#1E1E1E"/>
  <g font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="16" fill="#D4D4D4">
  <text x="24" y="40" xml:space="preserve"><tspan fill="#C586C0">import</tspan><tspan fill="#D4D4D4"> {</tspan></text>
  <text x="24" y="65" xml:space="preserve"><tspan fill="#D4D4D4">  </tspan><tspan fill="#9CDCFE">_EACH</tspan><tspan fill="#D4D4D4">,</tspan></text>
  <text x="24" y="90" xml:space="preserve"><tspan fill="#D4D4D4">  </tspan><tspan fill="#9CDCFE">toReactiveAdapterWithSource</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#C586C0">as</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#9CDCFE">toRA</tspan></text>
  <text x="24" y="115" xml:space="preserve"><tspan fill="#D4D4D4">} </tspan><tspan fill="#C586C0">from</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#CE9178">&apos;@huberst/markless&apos;</tspan></text>
  <text x="24" y="140" xml:space="preserve"><tspan fill="#C586C0">import</tspan><tspan fill="#D4D4D4"> { </tspan><tspan fill="#9CDCFE">computed</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#9CDCFE">signal</tspan><tspan fill="#D4D4D4"> } </tspan><tspan fill="#C586C0">from</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#CE9178">&apos;@preact/signals-core&apos;</tspan></text>
  <text x="24" y="165" xml:space="preserve"></text>
  <text x="24" y="190" xml:space="preserve"><tspan fill="#6A9955">// No need to think about re-rendering. Only reactive adapters cause change.</tspan></text>
  <text x="24" y="215" xml:space="preserve"><tspan fill="#C586C0">export</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#4FC1FF">ReactiveColorSelection</tspan><tspan fill="#D4D4D4"> = </tspan><tspan fill="#DCDCAA">component</tspan><tspan fill="#D4D4D4">((): </tspan><tspan fill="#4EC9B0">MarkLess</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> {</tspan></text>
  <text x="24" y="240" xml:space="preserve"></text>
  <text x="24" y="265" xml:space="preserve"><tspan fill="#D4D4D4">  </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#4FC1FF">colors</tspan><tspan fill="#D4D4D4"> = [</tspan><tspan fill="#CE9178">&apos;red&apos;</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#CE9178">&apos;green&apos;</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#CE9178">&apos;deepskyblue&apos;</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#CE9178">&apos;orange&apos;</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#CE9178">&apos;purple&apos;</tspan><tspan fill="#D4D4D4">]</tspan></text>
  <text x="24" y="290" xml:space="preserve"></text>
  <text x="24" y="315" xml:space="preserve"><tspan fill="#D4D4D4">  </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> [</tspan><tspan fill="#4FC1FF">selectedColorRA</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#4FC1FF">selectedColorSig</tspan><tspan fill="#D4D4D4">] = </tspan><tspan fill="#DCDCAA">toRA</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#DCDCAA">signal</tspan><tspan fill="#D4D4D4">&lt;</tspan><tspan fill="#4EC9B0">string</tspan><tspan fill="#D4D4D4"> | </tspan><tspan fill="#4EC9B0">null</tspan><tspan fill="#D4D4D4">&gt;(</tspan><tspan fill="#569CD6">null</tspan><tspan fill="#D4D4D4">))</tspan></text>
  <text x="24" y="340" xml:space="preserve"><tspan fill="#D4D4D4">  </tspan><tspan fill="#569CD6">const</tspan><tspan fill="#D4D4D4"> [</tspan><tspan fill="#4FC1FF">selectedColorStyleRA</tspan><tspan fill="#D4D4D4">] = </tspan><tspan fill="#DCDCAA">toRA</tspan><tspan fill="#D4D4D4">(</tspan></text>
  <text x="24" y="365" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#DCDCAA">computed</tspan><tspan fill="#D4D4D4">(() </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> ({ </tspan><tspan fill="#9CDCFE">color:</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#9CDCFE">selectedColorSig</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">value</tspan><tspan fill="#D4D4D4"> ?? </tspan><tspan fill="#CE9178">&apos;white&apos;</tspan><tspan fill="#D4D4D4"> })),</tspan></text>
  <text x="24" y="390" xml:space="preserve"><tspan fill="#D4D4D4">  )</tspan></text>
  <text x="24" y="415" xml:space="preserve"></text>
  <text x="24" y="440" xml:space="preserve"><tspan fill="#D4D4D4">  </tspan><tspan fill="#569CD6">function</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#DCDCAA">pickColor</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">color</tspan><tspan fill="#D4D4D4">: </tspan><tspan fill="#4EC9B0">string</tspan><tspan fill="#D4D4D4">) {</tspan></text>
  <text x="24" y="465" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#9CDCFE">selectedColorSig</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#9CDCFE">value</tspan><tspan fill="#D4D4D4"> = </tspan><tspan fill="#9CDCFE">color</tspan></text>
  <text x="24" y="490" xml:space="preserve"><tspan fill="#D4D4D4">  }</tspan></text>
  <text x="24" y="515" xml:space="preserve"></text>
  <text x="24" y="540" xml:space="preserve"><tspan fill="#D4D4D4">  </tspan><tspan fill="#C586C0">return</tspan><tspan fill="#D4D4D4"> [</tspan></text>
  <text x="24" y="565" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#4EC9B0" font-weight="bold">h3</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#6A9955">// Passing a reactive adapter to .style() makes it reactive.</tspan></text>
  <text x="24" y="590" xml:space="preserve"><tspan fill="#D4D4D4">      .</tspan><tspan fill="#DCDCAA">style</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">selectedColorStyleRA</tspan><tspan fill="#D4D4D4">)</tspan></text>
  <text x="24" y="615" xml:space="preserve"><tspan fill="#D4D4D4">      .</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;Select a color&apos;</tspan><tspan fill="#D4D4D4">),</tspan></text>
  <text x="24" y="640" xml:space="preserve"></text>
  <text x="24" y="665" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// Use _EACH to render a list of items. We pass a normal array here, but you</tspan></text>
  <text x="24" y="690" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// can also pass a reactive adapter to make it reactive.</tspan></text>
  <text x="24" y="715" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#DCDCAA">_EACH</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">colors</tspan><tspan fill="#D4D4D4">).</tspan><tspan fill="#DCDCAA">DO</tspan><tspan fill="#D4D4D4">((</tspan><tspan fill="#9CDCFE">color</tspan><tspan fill="#D4D4D4">) </tspan><tspan fill="#569CD6">=&gt;</tspan></text>
  <text x="24" y="740" xml:space="preserve"><tspan fill="#D4D4D4">      </tspan><tspan fill="#4EC9B0" font-weight="bold">button</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">color</tspan><tspan fill="#D4D4D4">).</tspan><tspan fill="#DCDCAA">event</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;click&apos;</tspan><tspan fill="#D4D4D4">, () </tspan><tspan fill="#569CD6">=&gt;</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#DCDCAA">pickColor</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">color</tspan><tspan fill="#D4D4D4">)),</tspan></text>
  <text x="24" y="765" xml:space="preserve"><tspan fill="#D4D4D4">    ),</tspan></text>
  <text x="24" y="790" xml:space="preserve"></text>
  <text x="24" y="815" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// Use _IF to conditionally render content. Here we pass a reactive adapter</tspan></text>
  <text x="24" y="840" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#6A9955">// to the condition, so it will re-render when the selected color changes.</tspan></text>
  <text x="24" y="865" xml:space="preserve"><tspan fill="#D4D4D4">    </tspan><tspan fill="#DCDCAA">_IF</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#9CDCFE">selectedColorRA</tspan><tspan fill="#D4D4D4">)</tspan></text>
  <text x="24" y="890" xml:space="preserve"><tspan fill="#D4D4D4">      .</tspan><tspan fill="#DCDCAA">THEN</tspan><tspan fill="#D4D4D4">(</tspan></text>
  <text x="24" y="915" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#4EC9B0" font-weight="bold">p</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;You selected: &apos;</tspan><tspan fill="#D4D4D4">, </tspan><tspan fill="#9CDCFE">selectedColorRA</tspan><tspan fill="#D4D4D4">)</tspan></text>
  <text x="24" y="940" xml:space="preserve"><tspan fill="#D4D4D4">      )</tspan></text>
  <text x="24" y="965" xml:space="preserve"><tspan fill="#D4D4D4">      .</tspan><tspan fill="#DCDCAA">ELSE</tspan><tspan fill="#D4D4D4">(</tspan></text>
  <text x="24" y="990" xml:space="preserve"><tspan fill="#D4D4D4">        </tspan><tspan fill="#4EC9B0" font-weight="bold">p</tspan><tspan fill="#D4D4D4">.</tspan><tspan fill="#DCDCAA">_</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">&apos;No color selected yet.&apos;</tspan><tspan fill="#D4D4D4">)</tspan></text>
  <text x="24" y="1015" xml:space="preserve"><tspan fill="#D4D4D4">      ),</tspan></text>
  <text x="24" y="1040" xml:space="preserve"><tspan fill="#D4D4D4">  ]</tspan></text>
  <text x="24" y="1065" xml:space="preserve"><tspan fill="#D4D4D4">})</tspan></text>
  </g>
</svg>
